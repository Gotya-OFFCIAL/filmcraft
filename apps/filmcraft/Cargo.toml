[package]
name = "filmcraft"
description = "FilmCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "filmcraft"
build = "build.rs"

# The app as a library: Android loads it as a cdylib (`android_main` in src/lib.rs); the
# desktop binary is the thin wrapper in src/main.rs. The extra .dll desktop builds produce is
# unused but harmless, and cargo has no target-specific crate-type.
[lib]
name = "filmcraft"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "filmcraft"
path = "src/main.rs"

# The workspace lints, except `unsafe_code` is `deny` instead of `forbid`: the Android entry
# point exports the `android_main` symbol the activity looks up (`#[unsafe(no_mangle)]`, an
# unsafe attribute) — the same shape ADR 0001 grants `filmcraft-platform` for its FFI. The one
# `#[allow(unsafe_code)]` sits on `android_main` alone.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "deny"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["filmcraft-engine/whisper", "filmcraft-engine/speech-download"]
# Natural Text to Speech voices (Kokoro-82M on the CPU, downloaded on first use).
neural-voices = ["filmcraft-engine/neural-voices"]

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-ui-egui = { workspace = true }
filmcraft-platform = { workspace = true }
egui = { workspace = true }
# `accesskit` moved to the non-Android target section below: eframe compile_error!s on the
# accesskit + android-native-activity pairing, and a feature enabled on ANY edge of this
# dependency is unified into every target's build of eframe.
serde_json = { workspace = true }
# Constant-time comparison of control-channel credentials.
subtle = "2.6"
log = { workspace = true }
cpal = "0.16"
chrono = { workspace = true, features = ["clock"] }
sys-locale = "0.3"
# Help menu / About / Discord links in the system browser (MIT; as PhotoCraft).
open = "5"

# Files and images on the system clipboard for Paste (#611); egui already uses it for text.
# arboard has no Android backend, so Paste from the system clipboard there waits for a
# ClipboardManager bridge (the text clipboard egui handles still works).
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3"
rfd = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }

# Phase 1 of the port runs on NativeActivity: it ships with the OS, so a Gradle-free APK needs
# no app-side Java at all. GameActivity would be the better shell (IME support, accesskit),
# but its Java extends androidx AppCompatActivity — packaging that closure without Gradle is
# a follow-up (see docs/mobile-ui.md). eframe rejects accesskit + native-activity, so the
# accesskit feature stays on the desktop edge only.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
# The AndroidApp handed to android_main (same winit as eframe).
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
# JNI for the IME bridge (packaging/android/java/ImeBridge.java): register its natives and
# drive the hidden EditText that owns the soft keyboard's InputConnection (src/ime.rs).
# 0.21 on purpose: android-activity's own 0.22 has a redesigned Env API; the C ABI is shared,
# and 0.21's classic JNIEnv/NativeMethod shape is the one this bridge is written against.
jni = "0.21.1"

[dev-dependencies]
glob = "0.3"
# graphics.rs: enumerate the real adapters in a test.
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2 = "0.6"
# Same winit as eframe: macOS event-loop options (no app activation when driven by an agent).
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with system: the XDG desktop portal's colour scheme. The zbus the
# portal file dialogs (rfd) and accesskit already use.
zbus = "5.19"

# Icon + VERSIONINFO for filmcraft.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
